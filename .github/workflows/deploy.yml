name: Deploy

# main   -> producción  (https://gustavosalvini.com.ar)
# staging -> staging    (preview)
# Los deploys son por SFTP al server de ecim.tech, con rsync.
#
# Sin inputs de usuario en los `run`: los triggers son push y workflow_dispatch
# con un choice cerrado, así que no hay superficie de inyección.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente a desplegar
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Caché de Chromium (lo usa mermaid en los diagramas)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-staging:
    name: Deploy staging
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.gustavosalvini.com.ar/
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bajar el build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy por SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          LABEL: staging
          NOINDEX: "1"
        run: bash .github/scripts/deploy-sftp.sh

  deploy-production:
    name: Deploy producción
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://gustavosalvini.com.ar/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bajar el build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy por SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          LABEL: producción
          BACKUP_DIR: /home/gsalvini/backups/gustavosalvini.com.ar
          BACKUP_KEEP: "5"
          SITE_URL: https://gustavosalvini.com.ar/
        run: bash .github/scripts/deploy-sftp.sh
