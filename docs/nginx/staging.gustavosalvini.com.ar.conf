# Preview de staging para el blog.
# Sirve estático directo desde nginx: para un sitio estático Apache no aporta nada.
#
# Instalación en el server:
#   sudo cp staging.gustavosalvini.com.ar.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/staging.gustavosalvini.com.ar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.gustavosalvini.com.ar --redirect
#
# Requiere el registro DNS A: staging.gustavosalvini.com.ar -> 143.198.173.62

server {
    listen 80;
    listen [::]:80;
    server_name staging.gustavosalvini.com.ar;

    root /home/gsalvini/staging_html;
    index index.html;

    # Staging nunca se indexa, ni siquiera por link.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Astro genera URLs con barra final: /posts/slug/ -> /posts/slug/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|webp|avif|gif|ico)$ {
        expires 1h;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
