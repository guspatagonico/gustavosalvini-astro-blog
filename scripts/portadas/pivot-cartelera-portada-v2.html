<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 750px; overflow: hidden; }
      body {
        position: relative;
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(820px 560px at 6% 4%, #173a72 0%, rgba(7, 13, 25, 0) 60%),
          radial-gradient(700px 520px at 96% 88%, #0c3f4a 0%, rgba(7, 13, 25, 0) 62%),
          linear-gradient(160deg, #070d19 0%, #0d1a2e 60%, #070d19 100%);
        color: #eef3f9;
      }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: linear-gradient(115deg, #000 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 78%);
      }
      .topbar {
        position: absolute; top: 0; left: 0; right: 0; height: 6px;
        background: linear-gradient(90deg, #2f6bff 0%, #4d86ff 45%, #2fd0c5 100%);
      }
      .head { position: absolute; left: 44px; top: 52px; width: 1100px; }
      .kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px; letter-spacing: 1.7px; color: #8397b2;
        text-transform: uppercase; white-space: nowrap;
      }
      h1 {
        margin-top: 20px; font-size: 60px; font-weight: 800; line-height: 1.02;
        letter-spacing: -1.6px; color: #ffffff; width: 900px;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
      }
      h1 span {
        background: linear-gradient(92deg, #63a4ff 0%, #3ec7c9 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .claim {
        margin-top: 16px; font-size: 19.5px; font-weight: 500; color: #9db0c8;
        letter-spacing: -0.1px;
      }
      .claim b { color: #dfe8f3; font-weight: 700; }
      .rail {
        position: absolute; right: 44px; top: 56px; text-align: right;
        font-family: "JetBrains Mono", monospace; font-size: 13px; line-height: 2.05;
        color: #7f93ae;
      }
      .rail b { color: #ffffff; font-weight: 700; margin-right: 9px; }
      .rail .live {
        display: inline-block; width: 7px; height: 7px; border-radius: 99px;
        background: #2fd0c5; margin-right: 9px; box-shadow: 0 0 12px #2fd0c5;
      }
      .panel {
        position: absolute; left: 44px; top: 292px; width: 1112px; height: 458px;
        border: 1px solid rgba(150, 180, 220, 0.24);
        border-bottom: none;
        border-radius: 22px 22px 0 0;
        overflow: hidden;
        box-shadow:
          0 -2px 0 rgba(255, 255, 255, 0.05) inset,
          0 -20px 70px rgba(47, 107, 255, 0.18),
          0 30px 80px rgba(0, 0, 0, 0.55);
        background: #f4f6fb;
      }
      .panel img { position: absolute; left: 0; top: -71px; width: 1112px; display: block; }
      .panel .fade {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(8,14,26,0) 62%, rgba(8,14,26,0.72) 88%, #080e1a 100%);
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="topbar"></div>
    <div class="rail">
      <div><span class="live"></span><b>02:15</b> convocatorias</div>
      <div><b>05:40</b> eventos</div>
      <div><b>06:15</b> noticias</div>
      <div><b>06:45</b> push</div>
    </div>
    <div class="head">
      <div class="kicker">Pívot · Cartelera de eventos, novedades y oportunidades</div>
      <h1>La máquina trabaja<br /><span>mientras Uruguay duerme</span></h1>
      <div class="claim">
        <b>75 fuentes</b>, diez procesos y una regla: <b>lo que no se puede fechar, no se publica.</b>
      </div>
    </div>
    <div class="panel">
      <img src="app.png" alt="" />
      <div class="fade"></div>
    </div>
  </body>
</html>
